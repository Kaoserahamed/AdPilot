name: AdPilot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # --omit=dev keeps the gate on what actually ships; dev-tooling advisories
      # are tracked by dependabot instead of blocking every pull request.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r apps/api/requirements.txt
      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement apps/api/requirements.txt --strict
      - run: python -m pytest

  quality:
    name: Repository quality score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r apps/api/requirements.txt
      - run: python -m tools.repo_score --fail-under 60
      - name: Save score report
        if: always()
        run: python -m tools.repo_score --json > repo-score.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-score
          path: repo-score.json

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t adpilot-api:${{ github.sha }} apps/api
      - name: Smoke test container
        run: |
          docker run -d --name adpilot-smoke -p 8000:8000 adpilot-api:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API healthy"
              curl -fsS http://127.0.0.1:8000/api/ready
              docker rm -f adpilot-smoke
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker logs adpilot-smoke
          docker rm -f adpilot-smoke
          exit 1

  stack:
    name: One-command stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
      # Proves `docker compose up` really brings the whole app up, which is the
      # claim the README makes and a buyer will try first.
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test the full stack
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null \
               && curl -fsS http://127.0.0.1:5173/api/health > /dev/null; then
              echo "Web served and API reachable through the proxy"
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready"
          docker compose logs
          docker compose down -v
          exit 1
