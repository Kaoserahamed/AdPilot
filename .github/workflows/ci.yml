name: AdPilot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Lint Python sources
        run: pipx run ruff check .
      - run: npm run typecheck
      - run: npm run test
      # Enforces the coverage floors configured in vite.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # --omit=dev keeps the gate on what actually ships; dev-tooling advisories
      # are tracked by dependabot instead of blocking every pull request.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The lock file pins every transitive dependency, so CI installs the same
      # versions locally and in the image.
      - run: pip install -r apps/api/requirements.lock.txt
      - name: Lint Python sources
        run: pipx run ruff check .
      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement apps/api/requirements.lock.txt --strict
      - run: python -m pytest
      # pytest.ini sets --cov=app --cov-fail-under=90, so this step is the gate.
      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: coverage.xml
          if-no-files-found: ignore

  quality:
    name: Repository quality score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r apps/api/requirements.txt
      - run: python -m tools.repo_score --fail-under 80
      - name: Save score report
        if: always()
        run: python -m tools.repo_score --json > repo-score.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repo-score
          path: repo-score.json

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t adpilot-api:${{ github.sha }} apps/api
      - name: Smoke test container
        run: |
          docker run -d --name adpilot-smoke -p 8000:8000 adpilot-api:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API healthy"
              curl -fsS http://127.0.0.1:8000/api/ready
              docker rm -f adpilot-smoke
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker logs adpilot-smoke
          docker rm -f adpilot-smoke
          exit 1

  fresh_clone:
    name: Fresh clone starts without credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Clones the repository again and boots it in an isolated directory, so a
      # local .env or a partially built image cannot make this pass. This is the
      # claim the README makes and the first thing a buyer tries. It runs as its
      # own job because it binds the same host ports as the stack job.
      - name: Verify a fresh clone starts with no credentials
        run: ./scripts/fresh_clone_check.sh

  stack:
    name: One-command stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves `docker compose up` really brings the whole app up, which is the
      # claim the README makes and a buyer will try first.
      - name: Build both images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test the full stack
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null \
               && curl -fsS http://127.0.0.1:5173/api/health > /dev/null; then
              echo "Web served and API reachable through the proxy"
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready"
          docker compose logs
          docker compose down -v
          exit 1
